# HealthRisk AI / HealthRisk Lab — CI pipeline
#
# Runs lint, typecheck, and the test suite with coverage gating (> = 60%).
# Designed to run on a GitHub Actions runner; the same checks should be
# runnable locally via `make check`.

name: healthrisk-ai ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  PYTHON_VERSION: "3.11"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install project and dev tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: ruff check .

      - name: Autofix-lint formatting with Ruff (fast feedback only)
        run: ruff format --check .

      - name: Typecheck with mypy
        run: mypy src tests

      - name: Run test suite with coverage gate
        run: pytest

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 14
