[project]
name = "healthrisk-ai"
version = "0.1.0"
description = "EHR/NLP/GNN survival stack feeding actuarial, credit, pharma, ESG downstream — plus a $500M interactive HealthRisk Lab simulation."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Healthcare Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow",
    "scipy>=1.10",
    "lifelines>=0.27",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "scikit-learn>=1.3",
    "torch>=2.0",
    "pytorch-lightning>=2.0",
    "torch-geometric",
    "transformers>=4.34",
    "sentencepiece",
    "shap>=0.44",
    "pyyaml",
    "pydantic>=2.0",
    "python-dotenv",
    "httpx",
    "tenacity",
    "rich",
    "streamlit>=1.28",
    "plotly",
    "pandas-stubs>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov",
    "hypothesis",
    "black>=24.0",
    "ruff>=0.3",
    "mypy>=1.8",
    "pre-commit",
]
docker = ["docker", "docker-compose"]

[project.scripts]
hrl-serve = "healthrisk_ai.cli:console_entry"

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    "build",
    "dist",
    "node_modules",
    "__pycache__",
]

[tool.ruff.lint]
select = ["E", "F", "I", "PGH", "PYI", "TCH", "W", "UP", "B", "C4", "SIM"]

[tool.black]
line-length = 120
target-version = ["py310", "py311", "py312"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
exclude = ["build", "dist", "node_modules", "__pycache__"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=src --cov-report=term-missing --cov-report=html --cov-fail-under=60 -q"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
fail_under = 60
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
